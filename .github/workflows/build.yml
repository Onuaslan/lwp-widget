name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (API-Client)
        run: ./gradlew :api:test
      - name: APK bauen
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: LWP-Widget-APK
          path: app/build/outputs/apk/release/*.apk
      - name: APK als Download veröffentlichen (Release „latest“)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk LWP-Widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LWP-Widget.apk --title "LWP Widget (neueste Version)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Handy herunterladen und installieren."
